[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Abinsanth/corvo-chat"

[workspace.dependencies]
corvo-chat-proto = { git = "https://github.com/Abinsanth/corvo-chat-server", tag = "proto-v0.1.0" }
corvo-chat-server = { git = "https://github.com/Abinsanth/corvo-chat-server", tag = "proto-v0.1.0" }
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10"
data-encoding = "2.11.1"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
futures = "0.3.34"
hkdf = "0.12.4"
hmac = "0.12"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = "0.14.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
unicode-normalization = "0.1"
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Smaller downloads for the release binaries.
[profile.release]
strip = true

# Debug builds and tests keep only line numbers (enough for panics and
# backtraces), and none for dependencies: a fraction of the disk space.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 is very slow unoptimized, and one test per crate runs the real
# 64 MiB setting.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
