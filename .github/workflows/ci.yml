name: CI

# Every push and PR runs CI, docs-only ones too: a skipped run never reports its
# checks, so once they're required, a docs-only PR could never merge.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --locked fails if Cargo.lock wasn't updated with Cargo.toml.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # rustls-family crates must use ring: aws-lc-rs needs CMake on musl and Windows.
      - name: TLS uses ring, not aws-lc-rs
        # The tree goes in a variable first, so the step fails if cargo tree does.
        run: |
          tree=$(cargo tree --locked --workspace -e normal)
          if grep aws-lc <<< "$tree"; then
            echo "something pulls in aws-lc-rs; set default-features = false and use ring"
            exit 1
          fi
      - name: The core has no terminal UI
        run: |
          tree=$(cargo tree --locked -p corvo-chat-core -e normal)
          if grep -E 'ratatui|crossterm' <<< "$tree"; then
            echo "corvo-chat-core must not depend on ratatui or crossterm"
            exit 1
          fi
      - name: No normal build enables insecure-test-kdf
        run: |
          tree=$(cargo tree --locked --workspace -e features,normal)
          if grep insecure-test-kdf <<< "$tree"; then
            echo "insecure-test-kdf is for tests only"
            exit 1
          fi

  # Linux clippy never sees cfg(windows) code.
  clippy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # The oldest Rust that Cargo.toml's rust-version promises.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # The core must keep building for the browser, with and without its web parts.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p corvo-chat-core --target wasm32-unknown-unknown --no-default-features
      - run: cargo build --locked -p corvo-chat-core --target wasm32-unknown-unknown --no-default-features --features web
      # Linux clippy never sees cfg(target_arch = "wasm32") code either.
      - run: cargo clippy --locked -p corvo-chat-core --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

  # The core in headless Chrome, against the real server on this machine
  # (the test bench). The runner image has Chrome and a matching chromedriver.
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The test runner must be the exact wasm-bindgen version in Cargo.lock.
      - name: Find the wasm-bindgen version
        id: wasm-bindgen
        run: |
          id=$(cargo pkgid --locked wasm-bindgen)
          echo "version=${id##*@}" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # It keeps serving in the background until the job ends.
      - name: Start the test bench
        run: |
          cargo build --locked -p corvo-chat-core --example test_server
          target/debug/examples/test_server --out "$RUNNER_TEMP/bench.json" > "$RUNNER_TEMP/bench.log" 2>&1 &
          for _ in $(seq 60); do
            if [ -f "$RUNNER_TEMP/bench.json" ]; then exit 0; fi
            sleep 1
          done
          echo "the test bench didn't start"
          cat "$RUNNER_TEMP/bench.log"
          exit 1
      - name: Browser tests
        env:
          CORVO_TEST_BENCH: ${{ runner.temp }}/bench.json
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test --locked -p corvo-chat-core --target wasm32-unknown-unknown --no-default-features --features web --test web
